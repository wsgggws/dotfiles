# 在终端、编辑器等应用中也默认使用中文；英文交给系统 ABC。
patch:
  style/candidate_list_layout: linear
  style/text_orientation: horizontal
  "app_options/com.apple.Spotlight/ascii_mode": false
  "app_options/com.alfredapp.Alfred/ascii_mode": false
