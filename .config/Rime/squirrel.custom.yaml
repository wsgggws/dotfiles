# 中文使用鼠须管；系统输入源由 Fn 和 KeyboardHolder 管理。
patch:
  style/font_point: 16
  style/candidate_list_layout: linear
  style/text_orientation: horizontal
  style/show_paging: false
  # 清除上游旧应用的内部英文/Vim 模式规则。
  app_options: null
  # 保留浏览器行内预编辑兼容设置。
  "app_options/com.google.Chrome/inline": true
  "app_options/com.microsoft.edgemac/inline": true
  "app_options/ru.keepcoder.Telegram/inline": true
