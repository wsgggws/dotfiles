# 五笔 86 的个人习惯；保留上游码表与方案文件。
patch:
  # 候选确实仅有一项时立即上屏；有多个候选时继续等待选择。
  speller/auto_select: true
  # 默认 Return 输出原始编码，这里改为确认当前高亮候选。
  editor/bindings/Return: confirm
  editor/bindings/KP_Enter: confirm
  # 保持横排显示；上下选字，左右翻页。
  selector/linear/bindings/Up: previous_candidate
  selector/linear/bindings/Down: next_candidate
  selector/linear/bindings/Left: previous_page
  selector/linear/bindings/Right: next_page
  # 聊天中直接输入半角 @，不打开符号候选。
  "punctuator/half_shape/@": "@"
  # 同一方案直接输入全拼；五笔候选优先，保留 z 拼音反查。
  engine/translators/+:
    - script_translator@pinyin
  pinyin:
    dictionary: pinyin_simp
    prism: pinyin_simp
    initial_quality: -1
    enable_completion: false
    enable_user_dict: false
    preedit_format:
      - xform/([nl])v/$1ü/
      - xform/([nl])ue/$1üe/
      - xform/([jqxy])v/$1u/
